name: Repair and verify audio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrn-audio-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-audio.txt

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -o pipefail

          python -m pip install --upgrade pip setuptools wheel 2>&1 \
            | tee audio-install.log

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt 2>&1 \
              | tee -a audio-install.log
          fi

          python -m pip install -r requirements-audio.txt 2>&1 \
            | tee -a audio-install.log

          python -m pip check 2>&1 \
            | tee -a audio-install.log

      - name: Audio-Umgebung vorprüfen
        shell: bash
        run: |
          set -o pipefail
          python verify_audio_environment.py 2>&1 \
            | tee audio-environment.log

      - name: Podcastquellen reparieren
        shell: bash
        run: |
          set -o pipefail
          python apply_audio_source_repairs.py 2>&1 \
            | tee audio-source-repair.log

      - name: Original-Podcasts aktualisieren
        shell: bash
        run: |
          set -o pipefail
          python aggregate_podcasts.py 2>&1 \
            | tee aggregate-podcasts.log

      - name: Podcasts und Radios prüfen
        shell: bash
        run: |
          set -o pipefail
          python check_audio_sources.py 2>&1 \
            | tee audio-source-check.log

      - name: Quellenstatus für App-Validator normalisieren
        shell: bash
        run: |
          set -o pipefail
          python normalize_source_health.py 2>&1 \
            | tee source-health-normalize.log

      - name: Erzeugte Audio-Dateien prüfen
        shell: bash
        run: |
          set -o pipefail
          python verify_audio_output.py 2>&1 \
            | tee audio-output-check.log

      - name: App-Prüfung ausführen
        shell: bash
        run: |
          set -o pipefail

          if [ -f tests/validate_app.py ]; then
            python tests/validate_app.py 2>&1 \
              | tee app-validation.log
          else
            echo "tests/validate_app.py nicht vorhanden." \
              | tee app-validation.log
          fi

      - name: Diagnoseberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrn-audio-diagnostics-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            *.log
            audio-environment-report.json
            audio-output-report.json
            audio-source-report.json
            source-health-report.json
            podcast-health.json
            audio-health.json

      - name: Ergebnisse speichern
        shell: bash
        run: |
          set -e

          git config user.name "wrn-audio-bot"
          git config user.email "actions@users.noreply.github.com"

          files=(
            podcast-sources.json
            podcast-source-archive.json
            derived-podcast-series.json
            audio-source-report.json
            podcasts.json
            podcast-health.json
            audio-health.json
            audio-environment-report.json
            audio-output-report.json
            source-health.json
            source-health-report.json
          )

          for file in "${files[@]}"; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Keine Audio- oder Schema-Änderungen."
            exit 0
          fi

          git commit -m "Repair audio data and normalize source health schema"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
