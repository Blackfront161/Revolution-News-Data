13m 51s nachgedacht
Prüfergebnis
Noch nicht als Update für den geschlossenen Test hochladen. Die Grundfunktionen sind vorhanden, aber ich habe mehrere konkrete Fehler und unfertige Punkte gefunden.

1. Sprachen
Die Sprachumschaltung funktioniert technisch: Sie setzt die Dokumentsprache, aktualisiert Nachrichten, Events, Podcasts, Stimmen, Filter und weitere Module.

Vollständig übersetzt sind die Oberflächen aber nicht.

Englisch und Deutsch sind in der Hauptoberfläche vollständig.

Spanisch, Französisch, Italienisch, Portugiesisch, Russisch, Griechisch und Türkisch enthalten dort jeweils nur wenige übersetzte Begriffe. Alles Fehlende wird automatisch durch Englisch ersetzt.

Events und Lesestatus sind bereits in allen neun Sprachen vorhanden.

Systemstatus, Barrierefreiheit, Speicherverwaltung, Quellenprofile und Übersetzungsvergleich existieren dagegen nur auf Deutsch und Englisch.

Auch Zine-Meldungen und mehrere Fehlertexte verwenden nur die Unterscheidung „Deutsch oder Englisch“.

Ergebnis: Alle Sprachen lassen sich auswählen und Übersetzungen können angefordert werden. Die App ist in sieben davon aber eine Mischung aus der gewählten Sprache und Englisch. Das sollte entweder vervollständigt oder in der Sprachauswahl deutlich als „Beta“ gekennzeichnet werden.

2. Warum zeigt „Original-Podcasts“ keine Dateien?
Korrektur zu meiner Zwischenmeldung: podcasts.json ist tatsächlich die richtige Liste für die Original-Podcasts. Die erzeugten Azure-Podcasts werden getrennt über den Worker geladen.

Das Problem ist:

podcasts.json enthält momentan nur [].

podcast-health.json enthält momentan nur {}.

Deshalb zählt der Systemstatus korrekt null Einträge.

Die Podcastquellen sind bereits eingetragen: In podcast-sources.json stehen 15 Quellen.

Es gibt außerdem einen eigenen Workflow, der alle vier Stunden aggregate_podcasts.py ausführt und anschließend podcasts.json sowie podcast-health.json speichert.

Wahrscheinlich ist Folgendes passiert:

Der Podcastworkflow erzeugte funktionierende Podcastdaten.

Der große 1.4-Upload überschrieb kurz danach die beiden erzeugten Dateien mit leeren Versionen.

Der normale Nachrichtenworkflow stellt sie nicht wieder her, weil er nur Nachrichten, Events und Nachrichtenquellen verarbeitet.

Sofortmaßnahme: In GitHub Actions den Workflow „Update Original Podcasts“ manuell mit Run workflow starten. Danach müssen beide JSON-Dateien wieder gefüllt sein. Beim letzten erfolgreichen Lauf lieferten ungefähr 8 der 15 Quellen Episoden; andere hatten unter anderem 403-, 404-, DNS- oder Serverfehler.

Damit das nicht wieder passiert, sollten erzeugte Dateien beim manuellen App-Upload nicht mit leeren Platzhalterdateien überschrieben werden.

3. Warum werden 90 von 213 Nachrichtenquellen als Fehler angezeigt?
Die 90 sind nicht 90 echte Totalausfälle. Der Systemstatus zählt falsch.

Die aktuelle Statuslogik wertet eine Quelle als Fehler, sobald eines davon zutrifft:

Status enthält error oder fail

ok ist false

oder das Feld error enthält irgendeinen Text.

Das dritte Kriterium ist problematisch. Einige Quellen liefern HTTP 200 und werden vom Prüfer als ok: true eingestuft, enthalten aber gleichzeitig einen Parserhinweis im Feld error. Die Oberfläche zählt auch diese als Fehler.

Der eigentliche Quellenprüfer unterscheidet bereits korrekt zwischen:

ok

warning

error.

Seine interne Zusammenfassung berechnet Fehler ausdrücklich getrennt von Warnungen.

Die Anzeige sollte deshalb drei Werte zeigen:

Erreichbar

Warnungen

Nicht erreichbar

Als echte Fehler bleiben beispielsweise Zeitüberschreitungen, ungültige SSL-Zertifikate, DNS-Ausfälle, HTTP 403/404/429 und Serverfehler. Ein RSS-Parserhinweis bei einer ansonsten erreichbaren Quelle sollte dagegen eine Warnung sein.

4. Smartphone-Navigation und Hamburger-Menü
Dein Eindruck stimmt. Die derzeitige Anordnung ist noch nicht sauber mobiloptimiert.

Oben stehen fünf kleine Verwaltungsbuttons. Darunter folgen fünf unterschiedlich breite Schnellzugriffe. Anschließend kommen Hamburger, Sortierung, Schriftgröße, Ansicht, Formatfilter und Suche in einer flexibel umbrechenden Leiste.

Die CSS-Regeln lassen die Buttons hauptsächlich abhängig von ihrer Textlänge umbrechen. Dadurch entstehen je nach Sprache und Displaybreite ungleichmäßige Reihen.

Ich würde es so anordnen:

Obere Leiste
Unter etwa 720 Pixeln nur noch:

App-Titel

Sprachwahl und Design in zwei gleich breiten Spalten

ein „Mehr“-Hamburger

In das Mehr-Menü kommen:

Info

Kontakt

Speicher

Systemstatus

Spenden

Hauptnavigation
Termine, Podcasts, Später lesen und Gelesen als gleichmäßiges 2×2-Raster. Zine darunter über die volle Breite. Unter etwa 340 Pixeln alles einspaltig.

Filterleiste
Der bisherige Hamburger öffnet momentan nur die Quellenliste. Das ist kein vollständiges mobiles Menü. Besser wäre ein Filtermenü mit:

Quellen

Sortierung

Darstellungsart

Inhaltsformat

Schriftgröße

Die Suche bleibt dauerhaft sichtbar und erhält eine eigene volle Zeile.

Damit wäre die Oberfläche auch bei langen französischen, russischen oder griechischen Bezeichnungen stabil. Die derzeit verstreuten Breakpoints 620, 640, 700 und 720 Pixel sollten dabei vereinheitlicht und zusätzlich bei 360, 390, 412 und 430 Pixeln getestet werden.

5. Muss die Versionsnummer unter „World Revolution News“ stehen?
Nein. Google Play verlangt nicht, dass die Versionsnummer ständig unter dem App-Titel angezeigt wird.

Momentan wird sie dort ausdrücklich eingefügt. Gleichzeitig steht in der Webkonfiguration nicht 1.4, sondern der interne Wert 2026.07.16-phase1k. Der Systemstatus übernimmt genau diesen Wert.

Meine Empfehlung:

Versionsnummer unter dem Titel entfernen.

Im Systemstatus und im Infofenster Version 1.4 anzeigen.

Den internen Cache-Bezeichner 2026.07.16-phase1k nur im Service Worker verwenden. Der Service Worker verwendet diesen Wert bereits zur Cache-Trennung.

Android: versionName "1.4".

Android: versionCode muss höher als bei der vorherigen Play-Version sein, vermutlich 4, sofern 3 tatsächlich der letzte verwendete Code war.

versionCode ist nur die interne, bei jedem Update steigende Zahl; versionName ist die für Nutzer*innen sichtbare Version. Ein bereits verwendeter versionCode kann nicht erneut hochgeladen werden. 

6. Bereit für den geschlossenen Google-Play-Test?
Noch nicht.

Vor dem AAB-Upload sollten diese Punkte erledigt sein:

Podcastworkflow ausführen und prüfen, dass podcasts.json und podcast-health.json nicht leer sind.

Fehlerzählung der Nachrichtenquellen korrigieren und Warnungen getrennt anzeigen.

Mobile Navigation neu anordnen.

Versionsanzeige auf 1.4 vereinheitlichen.

Entweder alle neun UI-Sprachen vervollständigen oder sieben davon als Beta kennzeichnen.

Prüfen, ob beim 1.4-Upload ältere Teile von aggregate.py unbeabsichtigt über robustere Funktionen geschrieben wurden.

Das tatsächliche Android-Projekt bauen und kontrollieren.

Den letzten Punkt konnte ich in den verbundenen GitHub-Repositories nicht abschließend prüfen: Dort liegt die Web-App, aber kein erkennbares vollständiges Android-Gradle-Projekt und kein neues AAB. Deshalb kann ich derzeit nicht bestätigen:

Paketname weiterhin exakt com.world.revolution

versionCode höher als die letzte Play-Version

versionName 1.4

targetSdk 36

identischer Play-App-Signierungsschlüssel

erfolgreich erzeugtes Release-AAB

keine offenen Play-Console-Deklarationen oder Pre-Review-Fehler

API 36 ist ab 31. August 2026 für neue Apps und Updates Pflicht; mit targetSdk 36 wäre dieser Teil bereits zukunftssicher. 

Für das Update gehst du anschließend in Testing → Closed testing → Manage track → Create new release, lädst das neue AAB hoch, ergänzt die Versionshinweise, prüfst die Fehlerübersicht und startest den Rollout. 

Die Regel mit mindestens zwölf Tester*innen über vierzehn aufeinanderfolgende Tage betrifft bei neueren persönlichen Entwicklerkonten den späteren Antrag auf Produktionszugang. Sie verhindert nicht, dass du innerhalb deines bestehenden geschlossenen Tests eine aktualisierte Version veröffentlichst. 

Gesamtstatus: ungefähr 80–85 % fertig, aber die Podcastdaten, Statuszählung, mobile Navigation und Android-Buildprüfung sind noch Release-Blocker.


