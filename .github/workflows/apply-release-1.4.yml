name: Apply World Revolution News 1.4 fixes safely

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-wrn-release-1-4-safe
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Release-Fixes sicher anwenden
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import apply_release_1_4 as release

          # Das Skript liegt aktuell im Repository-Hauptverzeichnis.
          release.ROOT = Path.cwd()

          # GitHub-Actions-Tokens dürfen ohne zusätzliche Berechtigung
          # keine anderen Workflow-Dateien verändern.
          release.patch_podcast_workflow = lambda: None

          # Keine Bootstrap-Dateien während des Laufs löschen.
          sys.argv = ["apply_release_1_4.py"]
          raise SystemExit(release.main())
          PY

      - name: Ergebnis prüfen
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "config.js",
              "index.html",
              "status-center.js",
              "aggregate_podcasts.py",
              "service-worker.js",
              "release-1.4.css",
              "release-1.4.js",
              "manifest.json",
          ]

          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Fehlende Dateien: " + ", ".join(missing))

          compile(
              Path("aggregate_podcasts.py").read_text(encoding="utf-8"),
              "aggregate_podcasts.py",
              "exec",
          )
          json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          print("Python, Manifest und erforderliche Release-Dateien sind gültig.")
          PY

          node --check status-center.js
          node --check release-1.4.js

      - name: Unerlaubte Workflow-Änderungen verhindern
        shell: bash
        run: |
          if ! git diff --quiet -- .github/workflows; then
            echo "::error::Der Release-Lauf darf keine Dateien unter .github/workflows verändern."
            git diff -- .github/workflows
            exit 1
          fi

      - name: Änderungen speichern
        shell: bash
        run: |
          git config user.name "WRN Release Bot"
          git config user.email "actions@users.noreply.github.com"

          # Nur ausdrücklich erlaubte App-Dateien aufnehmen.
          git add --             config.js             index.html             status-center.js             aggregate_podcasts.py             service-worker.js             release-1.4.css             release-1.4.js

          if git diff --cached --quiet; then
            echo "Keine neuen Release-Änderungen nötig."
            exit 0
          fi

          echo "Folgende Dateien werden veröffentlicht:"
          git diff --cached --name-status

          git commit -m "Finalize World Revolution News 1.4"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
