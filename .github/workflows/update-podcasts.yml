name: Update Original Podcasts

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"

permissions:
  contents: write

concurrency:
  group: wrn-main-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audio.txt

      - name: Python-Pakete installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          if [ -f requirements-audio.txt ]; then
            python -m pip install -r requirements-audio.txt
          fi
          python -m pip check

      - name: Podcast-Feeds aktualisieren
        run: python aggregate_podcasts.py

      - name: Erzeugte Podcast-Bibliothek sichern
        run: python sync_generated_podcasts.py --optional

      - name: Podcast-Daten prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool podcasts.json >/dev/null
          python -m json.tool podcast-health.json >/dev/null
          python -m json.tool generated-podcasts.json >/dev/null

      - name: Podcast-Daten speichern
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "wrn-podcast-bot"
          git config user.email "actions@users.noreply.github.com"

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.tmp' -o -name '*.log' \) -delete

          git add podcasts.json podcast-health.json generated-podcasts.json

          if [ -e audio-health.json ]; then
            git add audio-health.json
          fi

          git restore --staged .github/workflows 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Keine Podcast-Änderungen."
            exit 0
          fi

          git commit -m "Update original podcasts"
          bash wrn-safe-push.sh "${GITHUB_REF_NAME:-main}"
