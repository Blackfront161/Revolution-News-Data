name: Exa Discovery

on:
  schedule:
    # 4 Queries × 3 Läufe/Tag × max. 8 Resultate.
    # Das ist bewusst konservativ, damit der Exa-Free-Tier für Tests reicht.
    - cron: "17 */8 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Wie viele Stunden zurück suchen?"
        required: false
        default: "72"
      max_results:
        description: "Max. Resultate pro Query (1-10)"
        required: false
        default: "8"

permissions:
  contents: write

concurrency:
  group: wrn-main-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Konfiguration prüfen
        run: python exa_discovery.py --dry-run

      - name: Exa-Schlüssel prüfen
        id: exa-key
        shell: bash
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          if [ -z "${EXA_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "EXA_API_KEY ist noch nicht als Repository Secret gesetzt; Discovery wird übersprungen."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Neue Story-Kandidaten mit Exa suchen
        if: steps.exa-key.outputs.available == 'true'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '72' }}
          MAX_RESULTS: ${{ github.event.inputs.max_results || '8' }}
        run: |
          python exa_discovery.py \
            --lookback-hours "$LOOKBACK_HOURS" \
            --max-results "$MAX_RESULTS"

      - name: Ergebnis plausibilisieren
        if: steps.exa-key.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("exa-discovery.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("discoveredBy") != "exa":
              raise SystemExit("Ungültiger Discovery-Provider.")
          if data.get("mode") != "review-only":
              raise SystemExit("Exa darf im Prototyp nicht automatisch in news.json schreiben.")
          if int(data.get("queryCount") or 0) < 1:
              raise SystemExit("Keine Exa-Queries ausgeführt.")
          if float(data.get("reportedCostUsd") or 0) > 1.0:
              raise SystemExit("Kostenbremse: Ein einzelner Lauf meldet mehr als $1.")
          print(
              f"Exa Discovery OK: {data.get('candidateCount', 0)} Kandidaten, "
              f"${float(data.get('reportedCostUsd') or 0):.4f} gemeldet."
          )
          PY

      - name: Discovery-Ergebnis committen
        if: steps.exa-key.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wrn-news-bot"
          git config user.email "actions@users.noreply.github.com"

          git add exa-discovery.json

          if git diff --cached --quiet; then
            echo "Keine Exa-Datenänderungen."
            exit 0
          fi

          git commit -m "Refresh Exa discovery candidates"
          bash wrn-safe-push.sh "${GITHUB_REF_NAME:-main}"
