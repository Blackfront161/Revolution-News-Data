name: WRN Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.json"
      - "**/*.html"
      - "**/*.css"
      - "requirements*.txt"
      - ".github/workflows/**"
      - "service-worker.js"
      - "manifest.json"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.json"
      - "**/*.html"
      - "**/*.css"
      - "requirements*.txt"
      - ".github/workflows/**"
      - "service-worker.js"
      - "manifest.json"

permissions:
  contents: read

concurrency:
  group: wrn-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python-Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-audio.txt ]; then
            python -m pip install -r requirements-audio.txt
          fi

          python -m pip check

      - name: Alle JavaScript-Dateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(
            find . -type f -name '*.js' \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -print0
          )

          echo "$count JavaScript-Dateien geprüft."

      - name: Entwicklungen, Audio, Quellenfilter und Origin-Sicherheit testen
        shell: bash
        run: |
          set -euo pipefail

          node tests/test_stories_core.js
          node tests/test_audio_region_core.js
          node tests/test_source_filters.js
          node tests/test_video_hub.js
          node tests/test_audio_tab_183.js
          node tests/test_shared_translation_client.js
          node tests/test_article_interactions.js
          node tests/test_article_workspace_184.js
          node tests/test_prisoner_solidarity.js
          node tests/test_release_200.js
          python tests/test_video_assets.py
          python tests/test_audio_block2_assets.py
          python tests/test_prisoner_solidarity_assets.py
          python tests/test_release_200_assets.py
          node tests/test_block3_interface.js
          node tests/test_block3_runtime.js
          python tests/test_block3_assets.py
          python tests/test_source_recovery.py
          node tests/test_source_recovery_ui.js
          python tests/test_source_recovery_assets.py

          if [ -f tests/test_origin_safety.js ]; then
            node tests/test_origin_safety.js
          fi

      - name: Audioquellen und bestehende Releaseverträge testen
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=. python tests/test_audio_source_schema.py
          python tests/test_release_181.py
          python tests/test_release_182.py

      - name: Qualitätsrelease 1.8.5 prüfen
        shell: bash
        run: |
          set -euo pipefail

          python tests/test_feed_ux_185.py
          python tests/test_quality_release_185.py
          python tests/validate_app.py

      - name: Release Candidate 1.8.3 prüfen
        shell: bash
        run: |
          set -euo pipefail

          python release_audit_183.py
          node tests/test_runtime_selftest_183.js
          python tests/test_release_candidate_183.py

      - name: Alle Python-Dateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import py_compile

          files = [
              path
              for path in Path(".").rglob("*.py")
              if ".git" not in path.parts
          ]

          for path in files:
              py_compile.compile(
                  str(path),
                  doraise=True,
              )

          print(f"{len(files)} Python-Dateien geprüft.")
          PY

      - name: Alle JSON-Dateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import json

          files = [
              path
              for path in Path(".").rglob("*.json")
              if ".git" not in path.parts
          ]

          for path in files:
              json.loads(path.read_text(encoding="utf-8"))

          print(f"{len(files)} JSON-Dateien geprüft.")
          PY

      - name: Gepatchten CSP-Zustand simulieren
        run: python patch_csp_1722.py

      - name: Quellenregister und Audits erzeugen
        run: |
          python build_sources_registry.py
          python feature_audit.py
          python language_source_audit.py

      - name: Releaseverträge prüfen
        run: python validate_release_1722.py

      - name: Bestehenden App-Validator ausführen
        run: |
          if [ -f tests/validate_app.py ]; then
            python tests/validate_app.py
          fi

      - name: Lokalen Pages-Smoke-Test ausführen
        shell: bash
        run: |
          set -euo pipefail

          python -m http.server 8765 \
            > /tmp/wrn-http.log 2>&1 &

          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          sleep 2

          curl --fail --silent \
            http://127.0.0.1:8765/index.html \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:8765/config.js \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:8765/service-worker.js \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:8765/app-check.html \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:8765/runtime-selftest.js \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:8765/feature-audit.json \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:8765/language-source-audit.json \
            >/dev/null

      - name: Prüfberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrn-quality-reports-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            feature-audit.json
            language-source-audit.json
            sources-registry.json
            csp-audit.json
            workflow-audit.json
            release-readiness-183.json
            editorial-review.json
