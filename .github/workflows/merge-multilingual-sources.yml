name: Merge approved multilingual sources

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrn-data-write
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install -r requirements-audio.txt

      - name: Quellen ohne Löschungen zusammenführen
        run: python merge_multilingual_sources.py

      - name: Nachrichten neu aggregieren
        run: python aggregate.py

      - name: Schnelle Web-Feeds aktualisieren
        run: |
          if [ -f build_web_feeds.py ]; then
            python build_web_feeds.py
          fi

      - name: Original-Podcasts aktualisieren
        run: python aggregate_podcasts.py

      - name: Radio und Podcasts prüfen
        run: |
          python check_audio_sources.py
          python reconcile_audio_health.py

      - name: Nachrichtenquellen prüfen
        run: python check_news_sources.py

      - name: Quellenstatus normalisieren
        run: python normalize_source_health.py

      - name: Sprachabdeckung prüfen
        run: python language_source_audit.py

      - name: App prüfen
        run: |
          python feature_audit.py
          if [ -f tests/validate_app.py ]; then
            python tests/validate_app.py
          fi

      - name: Änderungen sicher speichern und pushen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "wrn-source-bot"
          git config user.email "actions@users.noreply.github.com"

          # Nur temporäre Python-Artefakte entfernen. Alle erzeugten
          # Projekt- und Datendateien sollen danach eingecheckt werden.
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f             \( -name '*.pyc' -o -name '*.pyo' -o -name '*.tmp' \)             -delete
          rm -rf .pytest_cache

          echo "Arbeitsbaum vor dem Commit:"
          git status --short

          # Der Runner startet aus einem sauberen Checkout. Deshalb sind
          # alle verbliebenen Änderungen Ergebnisse dieses Workflows.
          git add -A -- .

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Merge approved multilingual sources and refresh media"

          # Sicherheitsnetz: Falls ein Prozess eine Datei nach dem ersten
          # git add noch verändert hat, wird sie in denselben Commit aufgenommen.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Nachträgliche Änderungen werden in den Commit aufgenommen:"
            git status --short
            git add -A -- .
            git commit --amend --no-edit
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "FEHLER: Arbeitsbaum ist vor dem Rebase nicht sauber."
            git status --short
            exit 1
          fi

          # Andere WRN-Datenworkflows werden über wrn-data-write serialisiert.
          # Falls zwischen Checkout und Push trotzdem ein externer Commit kam,
          # wird bis zu dreimal sauber rebasiert und erneut gepusht.
          for attempt in 1 2 3; do
            echo "Push-Versuch ${attempt}/3"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Änderungen erfolgreich gepusht."
              exit 0
            fi

            sleep $((attempt * 4))
          done

          echo "FEHLER: Push nach drei Versuchen nicht möglich."
          exit 1
