name: Apply 1.7.22 CSP and audits

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrn-main-write
  cancel-in-progress: false

jobs:
  apply:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pflichtdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          required=(
            patch_csp_1722.py
            build_sources_registry.py
            feature_audit.py
            language_source_audit.py
            validate_release_1722.py
            wrn-safe-push.sh
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "FEHLER: Pflichtdatei fehlt: $file"
              exit 1
            fi
          done

      - name: Übersetzungs-Cache in CSP freigeben
        run: python patch_csp_1722.py

      - name: Gemeinsames Quellenregister erzeugen
        run: python build_sources_registry.py

      - name: Echten Funktions-Audit erzeugen
        run: python feature_audit.py

      - name: Echten Sprachquellen-Audit erzeugen
        run: python language_source_audit.py

      - name: Release 1.7.22 prüfen
        run: python validate_release_1722.py

      - name: Bestehenden App-Validator ausführen
        run: |
          if [ -f tests/validate_app.py ]; then
            python tests/validate_app.py
          else
            echo "Hinweis: tests/validate_app.py fehlt."
          fi

      - name: Keine Workflow-Selbstveränderung prüfen
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .github/workflows; then
            echo "FEHLER: Workflow-Dateien wurden verändert."
            git diff -- .github/workflows
            exit 1
          fi

      - name: Laufzeitberichte speichern
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "wrn-audit-bot"
          git config user.email \
            "actions@users.noreply.github.com"

          runtime_outputs=(
            sources-registry.json
            feature-audit.json
            language-source-audit.json
            csp-audit.json
            workflow-audit.json
          )

          for file in "${runtime_outputs[@]}"; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done

          python <<'PY'
          import json
          from pathlib import Path
          import subprocess

          report = json.loads(
              Path("csp-audit.json").read_text(
                  encoding="utf-8"
              )
          )

          for filename in report.get("changedFiles", []):
              path = Path(filename)

              if path.is_file():
                  subprocess.run(
                      ["git", "add", "--", filename],
                      check=True,
                  )
          PY

          git restore --staged .github/workflows \
            2>/dev/null || true

          if git diff --cached --name-only \
            | grep -q '^\.github/workflows/'
          then
            echo "FEHLER: Workflow-Datei wurde vorgemerkt."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Keine neuen CSP- oder Auditänderungen."
            exit 0
          fi

          echo "Vorgemerkte Dateien:"
          git diff --cached --name-only

          git commit -m \
            "Apply CSP translation cache and real audit reports"

          find . -type d -name __pycache__ \
            -prune -exec rm -rf {} +

          find . -type f \
            \( -name '*.pyc' \
            -o -name '*.pyo' \
            -o -name '*.tmp' \) \
            -delete

          if [ -n "$(git status --porcelain)" ]; then
            echo "FEHLER: Unerwartete Dateien nach dem Commit:"
            git status --short
            exit 1
          fi

          bash wrn-safe-push.sh \
            "${GITHUB_REF_NAME:-main}"
