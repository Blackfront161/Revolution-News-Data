name: Update News

on:
  schedule:
    # Zwei Stunden sind für aktuelle Nachrichten ein sinnvoller belastbarer
    # Zwischenschritt. Der vollständige Lauf benötigt derzeit rund 35 Minuten;
    # eine stündliche Vollaggregation könnte sich daher unnötig aufstauen.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrn-main-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audio.txt

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-audio.txt ]; then
            python -m pip install -r requirements-audio.txt
          fi

          python -m pip check

      # Phase 1J: Diese drei Befehle werden vom bestehenden App-Validator
      # ausdrücklich erwartet.
      - name: Nachrichten und Termine aggregieren
        run: python aggregate.py
        env:
          WRN_AGGREGATE_BUDGET_SECONDS: "1980"
          WRN_AGGREGATE_STOP_RESERVE_SECONDS: "120"
          WRN_CHECKPOINT_INTERVAL_SECONDS: "240"

      - name: Quellenkatalog erzeugen
        run: python build_source_catalog.py

      - name: Nachrichtenquellen prüfen
        run: python check_news_sources.py

      - name: Quellenstatus normalisieren
        run: |
          if [ -f normalize_source_health.py ]; then
            python normalize_source_health.py
          fi

      - name: Themen, Regionen und redaktionelle Prüfliste aktualisieren
        run: |
          if [ -f reclassify_news_categories.py ]; then
            python reclassify_news_categories.py
          fi

      - name: Schnelle Web-Feeds erzeugen
        run: |
          if [ -f build_web_feeds.py ]; then
            python build_web_feeds.py
          fi

      - name: Audits aktualisieren
        run: |
          if [ -f feature_audit.py ]; then
            python feature_audit.py
          fi

          if [ -f language_source_audit.py ]; then
            python language_source_audit.py
          fi

      - name: Zentrale Ausgabedateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          required=(
            news.json
            events.json
            editorial-review.json
            source-catalog.json
            source-health.json
            news-feed.json
            events-feed.json
            feed-status.json
          )

          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "FEHLER: $file fehlt oder ist leer."
              exit 1
            fi

            python -m json.tool "$file" >/dev/null
          done

          echo "events.json wird als veröffentlichte App-Datendatei übernommen."

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          news = json.loads(Path("news-feed.json").read_text(encoding="utf-8"))
          events = json.loads(Path("events-feed.json").read_text(encoding="utf-8"))
          status = json.loads(Path("feed-status.json").read_text(encoding="utf-8"))
          generated = datetime.fromisoformat(
              str(status["generatedAt"]).replace("Z", "+00:00")
          )
          age = (datetime.now(timezone.utc) - generated).total_seconds()

          if not status.get("ok"):
              raise SystemExit("FEHLER: feed-status.json meldet keinen Erfolg.")
          if not isinstance(news, list) or not news:
              raise SystemExit("FEHLER: news-feed.json ist leer oder ungültig.")
          if not isinstance(events, list):
              raise SystemExit("FEHLER: events-feed.json ist ungültig.")
          if status.get("news", {}).get("feedCount") != len(news):
              raise SystemExit("FEHLER: News-Anzahl stimmt nicht mit feed-status.json überein.")
          if status.get("events", {}).get("feedCount") != len(events):
              raise SystemExit("FEHLER: Termin-Anzahl stimmt nicht mit feed-status.json überein.")
          if age < 0 or age > 3600:
              raise SystemExit(f"FEHLER: Feed-Status ist nicht aktuell ({age:.0f} Sekunden).")

          print(
              f"Web-Feeds aktuell und konsistent: "
              f"{len(news)} Nachrichten, {len(events)} Termine."
          )
          PY

      - name: App-Validator ausführen
        run: |
          if [ -f tests/validate_app.py ]; then
            python tests/validate_app.py
          fi

      - name: Ergebnisse committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "wrn-news-bot"
          git config user.email "actions@users.noreply.github.com"

          find . -type d -name __pycache__ \
            -prune -exec rm -rf {} +

          find . -type f \
            \( -name "*.pyc" \
            -o -name "*.pyo" \
            -o -name "*.tmp" \
            -o -name "*.log" \) \
            -delete

          # Exakte Phase-1J-Zeile für den vorhandenen Validator:
          git add news.json events.json editorial-review.json source-catalog.json source-health.json
          git add news-feed.json events-feed.json feed-status.json

          optional_outputs=(
            source-health-report.json
            discovered-feeds.json
            news-feed.json
            events-feed.json
            feature-audit.json
            language-source-audit.json
            source-discovery-report.json
            source-health-history.json
            source-recovery-report.json
          )

          for file in "${optional_outputs[@]}"; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done

          # Erfasst zusätzlich alle bereits versionierten Generator-Ausgaben.
          git add -u

          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
            exit 0
          fi

          git commit -m "Update news, events and source health data"

          if [ -f wrn-safe-push.sh ]; then
            bash wrn-safe-push.sh "${GITHUB_REF_NAME:-main}"
            exit 0
          fi

          # Fallback, falls der 1.7.21a-Pushhelfer noch nicht vorhanden ist.
          branch="${GITHUB_REF_NAME:-main}"

          for attempt in 1 2 3; do
            echo "Push-Versuch ${attempt}/3"

            if [ -n "$(git status --porcelain)" ]; then
              echo "FEHLER: Arbeitsbaum ist vor dem Rebase nicht sauber."
              git status --short
              exit 1
            fi

            git fetch origin "$branch"
            git rebase "origin/$branch"

            if git push origin "HEAD:$branch"; then
              exit 0
            fi

            sleep $((attempt * 4))
          done

          echo "FEHLER: Push nach drei Versuchen fehlgeschlagen."
          exit 1
