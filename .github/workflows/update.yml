name: Update News

on:
  schedule:
    # Der vollständige Reparaturlauf ergänzt Volltexte, Bilder, Termine und
    # Quellenstatus. Aktuelle Meldungen lädt ein getrennter Schnelllauf.
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrn-main-write
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Auch wartende Reparaturläufe müssen am tatsächlichen Start main laden.
          ref: main
          fetch-depth: 0

      - name: Unveränderliche Erzeugungsbasis festhalten
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          base="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          printf 'WRN_BRIDGE_BASE_SHA=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audio.txt

      - name: Vorhandene verlustfreie Capturebasis prüfen
        run: |
          python - <<'PY_CAPTURE'
          from pathlib import Path
          from datetime import datetime, timezone
          from news_archive_capture import read_capture, read_capture_policies
          from build_source_archive import read_manifest, read_previous_archives, validate_capture_archive_coverage
          capture = read_capture(Path("news-archive-capture.json"))
          policies = read_capture_policies(Path("multilingual-source-registry.json"))
          previous = read_previous_archives(Path("news-archive"), read_manifest(Path("news-archive-manifest.json")))
          validate_capture_archive_coverage(capture, previous, policies, datetime.now(timezone.utc))
          PY_CAPTURE

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-audio.txt ]; then
            python -m pip install -r requirements-audio.txt
          fi

          python -m pip check

      # Phase 1J: Diese drei Befehle werden vom bestehenden App-Validator
      # ausdrücklich erwartet.
      - name: Nachrichten und Termine aggregieren
        id: aggregate
        run: python aggregate.py
        env:
          WRN_AGGREGATE_MODE: "enrich"
          WRN_AGGREGATE_BUDGET_SECONDS: "1980"
          WRN_AGGREGATE_STOP_RESERVE_SECONDS: "120"
          WRN_CHECKPOINT_INTERVAL_SECONDS: "240"

      - name: Quellenkatalog erzeugen
        run: |
          python build_source_catalog.py
          python build_sources_registry.py

      - name: Nachrichtenquellen prüfen
        run: python check_news_sources.py

      - name: Quellenstatus normalisieren
        run: |
          if [ -f normalize_source_health.py ]; then
            python normalize_source_health.py
          fi

      - name: Themen, Regionen und redaktionelle Prüfliste aktualisieren
        run: |
          if [ -f reclassify_news_categories.py ]; then
            python reclassify_news_categories.py
          fi

      - name: Schnelle Web-Feeds erzeugen
        run: |
          if [ -f build_web_feeds.py ]; then
            WRN_FEED_TARGETS="news,events,status" python build_web_feeds.py
          fi
          python build_source_archive.py

      - name: Audits aktualisieren
        run: |
          if [ -f feature_audit.py ]; then
            python feature_audit.py
          fi

          if [ -f language_source_audit.py ]; then
            python language_source_audit.py
          fi

      - name: Zentrale Ausgabedateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          required=(
            news.json
            events.json
            editorial-review.json
            source-catalog.json
            source-health.json
            news-feed.json
            events-feed.json
            feed-status.json
            news-archive-capture.json
            news-archive-manifest.json
          )

          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "FEHLER: $file fehlt oder ist leer."
              exit 1
            fi

            python -m json.tool "$file" >/dev/null
          done

          echo "events.json wird als veröffentlichte App-Datendatei übernommen."

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          news = json.loads(Path("news-feed.json").read_text(encoding="utf-8"))
          events = json.loads(Path("events-feed.json").read_text(encoding="utf-8"))
          status = json.loads(Path("feed-status.json").read_text(encoding="utf-8"))
          generated = datetime.fromisoformat(
              str(status["generatedAt"]).replace("Z", "+00:00")
          )
          age = (datetime.now(timezone.utc) - generated).total_seconds()

          if not status.get("ok"):
              raise SystemExit("FEHLER: feed-status.json meldet keinen Erfolg.")
          if not isinstance(news, list) or not news:
              raise SystemExit("FEHLER: news-feed.json ist leer oder ungültig.")
          if not isinstance(events, list):
              raise SystemExit("FEHLER: events-feed.json ist ungültig.")
          if status.get("news", {}).get("feedCount") != len(news):
              raise SystemExit("FEHLER: News-Anzahl stimmt nicht mit feed-status.json überein.")
          if status.get("events", {}).get("feedCount") != len(events):
              raise SystemExit("FEHLER: Termin-Anzahl stimmt nicht mit feed-status.json überein.")
          if age < 0 or age > 3600:
              raise SystemExit(f"FEHLER: Feed-Status ist nicht aktuell ({age:.0f} Sekunden).")

          print(
              f"Web-Feeds aktuell und konsistent: "
              f"{len(news)} Nachrichten, {len(events)} Termine."
          )
          PY

      - name: App-Validator ausführen
        run: |
          if [ -f tests/validate_app.py ]; then
            python tests/validate_app.py
          fi

      - name: Bridge-Volltexte und veröffentlichbare Generation prüfen
        run: python build_source_archive.py --verify-only --require-fresh

      - name: Ergebnisse committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "wrn-news-bot"
          git config user.email "actions@users.noreply.github.com"

          find . -type d -name __pycache__ \
            -prune -exec rm -rf {} +

          find . -type f \
            \( -name "*.pyc" \
            -o -name "*.pyo" \
            -o -name "*.tmp" \
            -o -name "*.log" \) \
            -delete

          # Exakte Phase-1J-Zeile für den vorhandenen Validator:
          git add news.json events.json editorial-review.json source-catalog.json sources-registry.json source-health.json
          git add news-archive-manifest.json news-archive news-archive-capture.json
          git add news-feed.json events-feed.json feed-status.json

          optional_outputs=(
            source-category-audit.json
            source-health-report.json
            discovered-feeds.json
            news-feed.json
            events-feed.json
            feature-audit.json
            language-source-audit.json
            source-discovery-report.json
            source-health-history.json
            source-recovery-report.json
            aggregate-run-status.json
          )

          for file in "${optional_outputs[@]}"; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done

          # Erfasst zusätzlich alle bereits versionierten Generator-Ausgaben.
          git add -u

          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
            exit 0
          fi

          git commit -m "Update news, events and source health data"

          bash wrn-bridge-safe-push.sh main "$WRN_BRIDGE_BASE_SHA"

      # Success persists capture in the data commit. Failure-only recovery is best
      # effort; cancellation, runner loss or artifact quota may prevent retention.
      - name: Validierte Capture-Rettung ohne Veröffentlichung vorbereiten
        id: capture_recovery_prepare
        if: ${{ always() && failure() && (steps.aggregate.outcome == 'success' || steps.aggregate.outcome == 'failure') }}
        run: |
          python prepare_capture_recovery.py \
            --output "$RUNNER_TEMP/wrn-capture-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --aggregation-outcome "$AGGREGATION_OUTCOME"
        env:
          AGGREGATION_OUTCOME: ${{ steps.aggregate.outcome }}

      - name: Recovery-only Capture sichern
        id: capture_recovery_upload
        if: ${{ always() && steps.capture_recovery_prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: wrn-capture-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/wrn-capture-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Bestätigte Recovery-ID und Digest prüfen
        id: capture_recovery_confirm
        if: ${{ always() && steps.capture_recovery_upload.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          printf 'Recovery-only artifact %s, SHA256 %s; keine automatische Wiederherstellung.\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
        env:
          ARTIFACT_ID: ${{ steps.capture_recovery_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.capture_recovery_upload.outputs.artifact-digest }}
