name: Update News

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Python-Werkzeuge aktualisieren
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Abhängigkeiten prüfen
        run: |
          python - <<'PY'
          import bs4
          import cloudscraper
          import feedparser
          import requests

          print("feedparser:", feedparser.__version__)
          print("requests:", requests.__version__)
          print("beautifulsoup4:", bs4.__version__)
          print("cloudscraper:", getattr(cloudscraper, "__version__", "installiert"))
          PY

      - name: Nachrichten aktualisieren
        run: python aggregate.py

      - name: Vollständige Nachrichtendateien prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          news = json.loads(Path("news.json").read_text(encoding="utf-8"))
          events = json.loads(Path("events.json").read_text(encoding="utf-8"))

          if not isinstance(news, list) or not news:
              raise SystemExit("news.json ist leer oder keine Liste.")
          if not isinstance(events, list):
              raise SystemExit("events.json ist keine Liste.")

          print(f"Vollständige Nachrichten: {len(news)}")
          print(f"Vollständige Termine: {len(events)}")
          PY

      - name: Schnellen Web-Feed erzeugen
        run: python build_web_feeds.py

      - name: Schnellen Web-Feed prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          news = json.loads(Path("news-feed.json").read_text(encoding="utf-8"))
          events = json.loads(Path("events-feed.json").read_text(encoding="utf-8"))
          status = json.loads(Path("feed-status.json").read_text(encoding="utf-8"))

          if not isinstance(news, list) or not news:
              raise SystemExit("news-feed.json ist leer oder beschädigt.")
          if not isinstance(events, list):
              raise SystemExit("events-feed.json ist beschädigt.")
          if status.get("ok") is not True:
              raise SystemExit("feed-status.json meldet einen Fehler.")

          print(f"Web-Nachrichten: {len(news)}")
          print(f"Web-Termine: {len(events)}")
          print(status)
          PY

      - name: Quellenkatalog erzeugen
        run: python build_source_catalog.py

      - name: Nachrichtenquellen technisch prüfen
        run: python check_news_sources.py

      - name: Änderungen speichern
        run: |
          git config --global user.name "News-Bot"
          git config --global user.email "bot@revolutionnews.net"
          git add             news.json             events.json             news-feed.json             events-feed.json             feed-status.json             config.js             source-catalog.json             source-health.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Update news and lightweight web feed"
            git pull --rebase origin main
            git push origin main
          fi
