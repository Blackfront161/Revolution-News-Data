name: Refresh News Fast

on:
  push:
    branches:
      - main
    paths:
      - aggregate.py
      - news_retention.py
      - news_archive_capture.py
      - duplicate_feed_ownership.py
      - reviewed_article_identity.py
      - wrn-bridge-safe-push.sh
      - prepare_capture_recovery.py
      - reviewed_article_metadata.py
      - build_web_feeds.py
      - build_source_archive.py
      - source_import_policy.py
      - source_endpoint_repairs.py
      - multilingual-source-registry.json
      - requirements-wrn.lock.txt
      - .github/workflows/update-fast.yml
  schedule:
    # Feed-Metadaten und vorhandene Feed-Inhalte werden stündlich übernommen.
    # Volltexte und zusätzliche Bilder ergänzt der getrennte Reparaturlauf.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrn-main-write
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Geplante Läufe können hinter einem anderen Schreibworkflow warten.
          # Deshalb beim tatsächlichen Jobstart immer den neuesten main-Stand laden.
          ref: main
          fetch-depth: 0

      - name: Unveränderliche Erzeugungsbasis festhalten
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          base="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          printf 'WRN_BRIDGE_BASE_SHA=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-wrn.lock.txt

      - name: Vorhandene verlustfreie Capturebasis prüfen
        run: |
          python - <<'PY_CAPTURE'
          from pathlib import Path
          from datetime import datetime, timezone
          from news_archive_capture import read_capture, read_capture_policies
          from build_source_archive import read_manifest, read_previous_archives, validate_capture_archive_coverage
          capture = read_capture(Path("news-archive-capture.json"))
          policies = read_capture_policies(Path("multilingual-source-registry.json"))
          previous = read_previous_archives(Path("news-archive"), read_manifest(Path("news-archive-manifest.json")))
          validate_capture_archive_coverage(capture, previous, policies, datetime.now(timezone.utc))
          PY_CAPTURE

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-wrn.lock.txt
          python -m pip check

      - name: Aktuelle Feed-Einträge parallel abrufen
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Abrufversuch ${attempt}/3"
            if python aggregate.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "FEHLER: Der schnelle Abruf ist nach drei Versuchen fehlgeschlagen."
          exit 1
        env:
          WRN_AGGREGATE_MODE: "fast"
          WRN_FAST_FETCH_WORKERS: "16"
          WRN_AGGREGATE_BUDGET_SECONDS: "900"
          WRN_AGGREGATE_STOP_RESERVE_SECONDS: "60"
          WRN_CHECKPOINT_INTERVAL_SECONDS: "120"

      - name: News-Feed und Status erzeugen
        run: |
          python build_source_catalog.py
          python build_sources_registry.py
          WRN_FEED_TARGETS="news,status" python build_web_feeds.py
          python build_source_archive.py

      - name: Aktualität und Datenintegrität prüfen
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          news = json.loads(Path("news-feed.json").read_text(encoding="utf-8"))
          status = json.loads(Path("feed-status.json").read_text(encoding="utf-8"))
          run = json.loads(Path("aggregate-run-status.json").read_text(encoding="utf-8"))

          if not news or status.get("news", {}).get("feedCount") != len(news):
              raise SystemExit("FEHLER: News-Feed ist leer oder inkonsistent.")
          if not status.get("ok") or status.get("news", {}).get("bytes") != Path("news-feed.json").stat().st_size:
              raise SystemExit("FEHLER: Feed-Status oder Bytebindung ungültig.")
          if run.get("mode") != "fast":
              raise SystemExit("FEHLER: Falscher Aggregationsmodus.")
          if run.get("stoppedForBudget"):
              raise SystemExit("FEHLER: Der schnelle Abruf erreichte sein Zeitbudget.")
          if int(run.get("sourcesWithEntries") or 0) < 20:
              raise SystemExit("FEHLER: Zu wenige Quellen lieferten Feed-Einträge.")
          fetched = datetime.fromisoformat(
              str(status["lastSuccessfulFetchAt"]).replace("Z", "+00:00")
          )
          age = (datetime.now(timezone.utc) - fetched).total_seconds()
          if age < 0 or age > 3600:
              raise SystemExit(f"FEHLER: Schnellabruf ist nicht aktuell ({age:.0f} Sekunden).")
          newest = datetime.fromisoformat(
              str(status["news"]["newestArticleAt"]).replace("Z", "+00:00")
          )
          newest_age = (datetime.now(timezone.utc) - newest).total_seconds()
          if int(run.get("newArticles") or 0) > 0 and newest_age > 30 * 3600:
              raise SystemExit(
                  "FEHLER: Metadaten wurden aktualisiert, aber der neueste "
                  f"Artikel ist {newest_age / 3600:.1f} Stunden alt."
              )
          if status.get("publication", {}).get("pending"):
              raise SystemExit("FEHLER: Feed-Veröffentlichung ist noch ausstehend.")
          print(
              f"Schnellabruf OK: {run['sourcesWithEntries']} Quellen, "
              f"{run['newArticles']} neue Artikel."
          )
          PY

      - name: Bridge-Volltexte und veröffentlichbare Generation prüfen
        run: python build_source_archive.py --verify-only --require-fresh

      - name: Ergebnisse committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wrn-news-bot"
          git config user.email "actions@users.noreply.github.com"

          # Der Nachrichten-Schnelllauf darf den separat gepflegten
          # Terminbestand weder umsortieren noch veröffentlichen.
          git restore -- events.json events-feed.json

          git add news.json news-feed.json feed-status.json source-catalog.json sources-registry.json
          git add news-archive-manifest.json news-archive news-archive-capture.json
          git add aggregate-errors.json aggregate-run-status.json

          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
            exit 0
          fi

          git commit -m "Refresh current news feed"
          bash wrn-bridge-safe-push.sh main "$WRN_BRIDGE_BASE_SHA"

      # Success persists capture in the data commit. Failure-only recovery is best
      # effort; cancellation, runner loss or artifact quota may prevent retention.
      - name: Validierte Capture-Rettung ohne Veröffentlichung vorbereiten
        id: capture_recovery_prepare
        if: ${{ always() && failure() && (steps.aggregate.outcome == 'success' || steps.aggregate.outcome == 'failure') }}
        run: |
          python prepare_capture_recovery.py \
            --output "$RUNNER_TEMP/wrn-capture-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --aggregation-outcome "$AGGREGATION_OUTCOME"
        env:
          AGGREGATION_OUTCOME: ${{ steps.aggregate.outcome }}

      - name: Recovery-only Capture sichern
        id: capture_recovery_upload
        if: ${{ always() && steps.capture_recovery_prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: wrn-capture-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/wrn-capture-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Bestätigte Recovery-ID und Digest prüfen
        id: capture_recovery_confirm
        if: ${{ always() && steps.capture_recovery_upload.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          printf 'Recovery-only artifact %s, SHA256 %s; keine automatische Wiederherstellung.\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
        env:
          ARTIFACT_ID: ${{ steps.capture_recovery_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.capture_recovery_upload.outputs.artifact-digest }}
