name: App prüfen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "tests/**"
      - ".github/workflows/validate-app.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "tests/**"
      - ".github/workflows/validate-app.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Dateien und Syntax prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: App-Struktur und Release 1.8.1 prüfen
        shell: bash
        run: |
          set -euo pipefail

          python tests/validate_app.py
          python tests/test_release_181.py
          PYTHONPATH=. python tests/test_audio_source_schema.py

      - name: JavaScript-Syntax und Kernlogik prüfen
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            config.js \
            offline-db.js \
            status-center.js \
            app.js \
            service-worker.js \
            release-1.5-nav.js \
            audio-region-core.js \
            audio-tab.js \
            video-hub.js \
            source-verification.js
          do
            echo "Prüfe $file"
            node --check "$file"
          done

          node tests/test_stories_core.js
          node tests/test_audio_region_core.js

      - name: Python-Dateien kompilieren
        shell: bash
        run: |
          set -e
          find . -maxdepth 2 -name "*.py" -print0 | xargs -0 -r python -m py_compile

