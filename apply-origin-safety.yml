name: Apply 1.7.21 origin safety

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrn-main-write
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pflichtdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          required=(
            wrn-origin-safety.js
            harden_wrn_repository.py
            wrn-safe-push.sh
            config.js
            service-worker.js
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "FEHLER: Pflichtdatei fehlt: $file"
              exit 1
            fi
          done

      - name: Laufzeitdateien absichern
        run: python harden_wrn_repository.py

      - name: Keine Workflow-Selbstveränderung prüfen
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .github/workflows; then
            echo "FEHLER: Der Lauf hat Workflow-Dateien verändert."
            git diff -- .github/workflows
            exit 1
          fi

          echo "Workflow-Dateien sind unverändert."

      - name: JavaScript-Syntax prüfen
        run: |
          node --check wrn-origin-safety.js
          node --check config.js
          node --check service-worker.js

      - name: Origin-Sicherheit direkt testen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          'use strict';

          const assert = require('node:assert/strict');
          const safety = require('./wrn-origin-safety.js');

          class FakeStorage {
            constructor(values) {
              this.values = new Map(Object.entries(values));
            }

            get length() {
              return this.values.size;
            }

            key(index) {
              return [...this.values.keys()][index] ?? null;
            }

            removeItem(key) {
              this.values.delete(key);
            }

            has(key) {
              return this.values.has(key);
            }
          }

          (async () => {
            assert.equal(
              safety.isOwnedCacheName('wrn-app-v1'),
              true
            );
            assert.equal(
              safety.isOwnedCacheName('foreign-cache'),
              false
            );

            const storage = new FakeStorage({
              wrn_theme: 'dark',
              foreign_theme: 'keep'
            });

            assert.equal(
              safety.clearOwnedStorage(storage),
              1
            );
            assert.equal(
              storage.has('foreign_theme'),
              true
            );

            const deleted = [];
            const fakeCaches = {
              async keys() {
                return [
                  'wrn-app-v1',
                  'foreign-cache'
                ];
              },
              async delete(name) {
                deleted.push(name);
                return true;
              }
            };

            assert.equal(
              await safety.clearOwnedCaches(fakeCaches),
              1
            );
            assert.deepEqual(
              deleted,
              ['wrn-app-v1']
            );

            assert.equal(
              safety.isOwnedScope(
                'https://blackfront161.github.io/'
                + 'Revolution-News-Data/'
              ),
              true
            );

            assert.equal(
              safety.isOwnedScope(
                'https://blackfront161.github.io/'
                + 'Other-Project/'
              ),
              false
            );

            console.log(
              'WRN origin safety test: OK'
            );
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Service Worker statisch prüfen
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            "const WRN_CACHE_PREFIX = 'wrn-'" \
            service-worker.js

          grep -q \
            "name.startsWith(WRN_CACHE_PREFIX)" \
            service-worker.js

          if grep -n \
            ".filter(name => !keep.has(name))" \
            service-worker.js
          then
            echo "FEHLER: Breite Cache-Löschung gefunden."
            exit 1
          fi

      - name: App-Validator ausführen
        run: |
          if [ -f tests/validate_app.py ]; then
            python tests/validate_app.py
          else
            echo "Hinweis: App-Validator nicht vorhanden."
          fi

      - name: Nur Laufzeitänderungen committen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "wrn-safety-bot"
          git config user.email \
            "actions@users.noreply.github.com"

          find . -type d -name __pycache__ \
            -prune -exec rm -rf {} +

          find . -type f \
            \( -name '*.pyc' \
            -o -name '*.pyo' \
            -o -name '*.tmp' \) \
            -delete

          runtime_files=(
            app.js
            data-control.js
            recovery.html
            mobile-repair.html
            origin-safety-report.json
          )

          for file in "${runtime_files[@]}"; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done

          # Harte Schutzbarriere:
          git restore --staged .github/workflows \
            2>/dev/null || true

          if git diff --cached --name-only \
            | grep -q '^\.github/workflows/'
          then
            echo "FEHLER: Workflow-Datei wurde vorgemerkt."
            git diff --cached --name-only
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Keine neuen Laufzeitänderungen."
            exit 0
          fi

          echo "Vorgemerkte Laufzeitdateien:"
          git diff --cached --name-only

          git commit -m \
            "Apply repository-scoped browser data protection"

          bash wrn-safe-push.sh \
            "${GITHUB_REF_NAME:-main}"
