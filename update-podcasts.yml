name: Update Original Podcasts

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"

permissions:
  contents: write

concurrency:
  group: update-original-podcasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python-Pakete installieren
        run: pip install -r requirements.txt

      - name: Podcast-Feeds aktualisieren
        run: python aggregate_podcasts.py

      - name: Podcast-Daten speichern
        run: |
          git config user.name "News-Bot"
          git config user.email "actions@users.noreply.github.com"
          git add podcasts.json podcast-health.json
          if git diff --cached --quiet; then
            echo "Keine Podcast-Änderungen"
          else
            git commit -m "Update original podcasts"
            git pull --rebase origin main
            git push origin main
          fi
