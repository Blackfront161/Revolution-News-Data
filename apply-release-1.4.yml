name: Apply World Revolution News 1.4 fixes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-wrn-release-1-4
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Release-Fixes anwenden
        run: python tools/apply_release_1_4.py --cleanup-bootstrap

      - name: Dateien prüfen
        run: |
          python -m py_compile aggregate_podcasts.py
          node --check status-center.js
          node --check release-1.4.js
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          print('Manifest und Skripte sind syntaktisch gültig.')
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "WRN Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig."
          else
            git commit -m "Finalize World Revolution News 1.4"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
